name: Collecte des offres

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests des règles de détection
        run: python -m pytest -q tests

      - name: Collecte
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m scraper.main

      - name: Publication des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/offers.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des offres ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
