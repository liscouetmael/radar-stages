name: diag-workday
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in "arianegroup wd3 EXTERNALALL" "thales wd3 Careers" "ag wd3 Airbus"; do
            set -- $t
            U="https://$1.$2.myworkdayjobs.com/wday/cxs/$1/$3/jobs"
            D='{"appliedFacets":{},"limit":20,"offset":0,"searchText":"intern"}'
            curl -s -o /dev/null -w "$1 bot: %{http_code}\n" -X POST -H "Content-Type: application/json" -A "Mozilla/5.0 (compatible; RechercheStageBot/1.0)" -d "$D" "$U"
            curl -s -o /dev/null -w "$1 nav: %{http_code}\n" -X POST -H "Content-Type: application/json" -H "Accept: application/json" -H "Accept-Language: fr-FR,fr;q=0.9,en;q=0.8" -H "Origin: https://$1.$2.myworkdayjobs.com" -H "Referer: https://$1.$2.myworkdayjobs.com/$3" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" -d "$D" "$U"
            curl -s -o /dev/null -w "$1 page: %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" "https://$1.$2.myworkdayjobs.com/$3"
          done
          curl -sI -X POST -H "Content-Type: application/json" -d '{}' "https://thales.wd3.myworkdayjobs.com/wday/cxs/thales/Careers/jobs" | head -20
